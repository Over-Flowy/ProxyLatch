name: Release

# Push a tag like v1.0.0 to build both programs and publish them as a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        shell: cmd
        run: build.bat
      - name: Rename
        shell: bash
        run: mv dist/ProxyLatch.exe ProxyLatch-windows-x64.exe
      - uses: actions/upload-artifact@v6
        with:
          name: windows
          path: ProxyLatch-windows-x64.exe

  linux:
    # the oldest supported runner: the program then also runs on older distributions (glibc)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: |
          sudo apt-get update
          bash build.sh   # works even if git lost the executable bit
      - name: Rename
        run: mv dist/proxylatch proxylatch-linux-x64
      - uses: actions/upload-artifact@v6
        with:
          name: linux
          path: proxylatch-linux-x64

  release:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v7
        with:
          merge-multiple: true
      - name: Checksums
        run: sha256sum ProxyLatch-windows-x64.exe proxylatch-linux-x64 > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            ProxyLatch-windows-x64.exe
            proxylatch-linux-x64
            SHA256SUMS.txt
          generate_release_notes: true
