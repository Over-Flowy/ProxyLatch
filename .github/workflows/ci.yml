name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -r requirements.txt pytest pyflakes
      - name: Lint
        run: python -m pyflakes proxylatch.py core.py gui.py backend_windows.py backend_linux.py linux_helper.py tests
      - name: Test
        run: python -m pytest -q
